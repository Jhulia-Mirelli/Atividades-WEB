<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <title>FORMULÁRIO - AULA 3</title>
</head>

<body>
    <form action="nomedapagina.php" method="POST">
        <label for="nome">Nome</label>
        <input type="text" id="nome">
        <br>

        <label for="email">Email</label>
        <input type="email" id="email">
        <br>

        <label for="senha">Senha</label>
        <input type="password" id="senha">
        <br>

        <label for="dataNasc">Data de Nascimento</label>
        <input type="date" id="dataNasc">
        <br>

        <label>Gênero</label>

        <input type="radio" id="feminino" name="genero">
        <label for="feminino">Feminino</label>

        <input type="radio" id="masculino" name="genero">
        <label for="masculino">Masculino</label>

        <input type="radio" id="outro" name="genero">
        <label for="outro">Outro</label>
        <br>

        <label for="endereco">Endereço</label>
        <input type="text" id="endereco">
        <br>

        <label for="cep">CEP</label>
        <input type="text" id="cep" maxlength="8">
        <br>

        <label for="cidade">Cidade</label>
        <input type="text" id="cidade">
        <br>

        <label for="estado">Estado</label>
        <select id="estado" name="estado">
            <option value="">Selecione o Estado</option>
            <option value="AC">Acre</option>
            <option value="AL">Alagoas</option>
            <option value="AP">Amapá</option>
            <option value="AM">Amazonas</option>
            <option value="BA">Bahia</option>
            <option value="CE">Ceará</option>
            <option value="ES">Espírito Santo</option>
            <option value="GO">Goiás</option>
            <option value="MA">Maranhão</option>
            <option value="MT">Mato Grosso</option>
            <option value="MS">Mato Grosso do Sul</option>
            <option value="MG">Minas Gerais</option>
            <option value="PA">Pará</option>
            <option value="PB">Paraíba</option>
            <option value="PR">Paraná</option>
            <option value="PE">Pernambuco</option>
            <option value="PI">Piauí</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="RN">Rio Grande do Norte</option>
            <option value="RS">Rio Grande do Sul</option>
            <option value="RO">Rondônia</option>
            <option value="RR">Roraima</option>
            <option value="SC">Santa Catarina</option>
            <option value="SP">São Paulo</option>
            <option value="SE">Sergipe</option>
            <option value="TO">Tocantins</option>
            <option value="DF">Distrito Federal</option>
        </select>
        <br>

        <label for="tamCalca">Número da Calça</label>
        <input type="number" id="tamCalca">
        <br>

        <label for="tamSapato">Número do Sapato</label>
        <input type="" id="numSapato">
        <br>

        <label for="cor1">Escolha cor preferida</label>
        <input type="color" id="cor1">
        <br>

        <label for="cor2">Escolha 2° cor preferida</label>
        <input type="color" id="cor2">
        <br>

        <label for="obs">Observações</label>
        <textarea id="obs"></textarea>
        <br>

        <input type="checkbox" id="clube">
        <label for="clube">Deseja participar do nosso clube?</label>
        <br>

        <input type="checkbox" id="copo">
        <label for="copo">Deseja participar da promoção?</label>
        <br>

        <input type="hidden" id="origem" value="cliente cadastrado pelo site">
        <br>

        <input type="submit" id="enviar" value="Enviar">
        <input type="reset" id="limpar" value="Limpar">

        <button>Botão</button>

    </form>
</body>

</html>
