<!DOCTYPE html>
<html lang="pt-br">

<head>
    <!-- Meta tags Obrigatórias -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1,
shrink-to-fit=no">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Delivery de comida - Formulário de pedido</title>
    <style type="text/css">
        main {
            margin-top: 160px;
        }
    </style>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
            <a class="navbar-brand" href="#">Cocina del Jefe</a>

            <ul class="navbar-nav mr-auto">
                <li class="nav-item"><a class="nav-link" href="cardapio.html">Cardápio</a></li>
                <li class="nav-item"><a class="nav-link" href="tabela_nutricional.html">Tabela Nutricional</a></li>
                <li class="nav-item"><a class="nav-link" href="pedido.html">Faça seu pedido</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Baixe nosso e-book</a></li>
            </ul>
        </nav>

    </header>
    <main role="main" class="container">

        <div class="row">
            <h2 class="text-center">Faça seu pedido</h2>
        </div>

        <div class="row justify-content-center">
            <div class="col-sm-6">
                <form>
                    <label for="whatsapp" class="d-sm-none">Número whatsapp</label>
                    <input type="text" class="form-control" id="whatsapp" name="whatsapp"
                        placeholder="Informe seu whatsapp" required aria-required="true">

                    <br>

                    <label for="pagamento" class="d-sm-none">Forma de pagamento</label>
                    <select id="pagamento" name="pagamento" class="form-control" required aria-required="true">
                        <option>Escolha a forma de pagamento</option>
                        <option>Mastercard crédito</option>
                        <option>Mastercard débito</option>
                        <option>Visa crédito</option>
                        <option>Visa débito</option>
                        <option>Dinheiro</option>
                    </select>

                    <br>
                    <input type="checkbox" name="bebida">
                    <label for="bebida">Bebida acompanha</label>
                    <button type="submit" class="btn btn-block btn-primary btn-lg">Quero que me chame no
                        whatsapp</button>
                </form>
            </div>
        </div>
    </main>
</body>

</html>
